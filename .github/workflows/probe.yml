name: Probe sources
on:
  workflow_dispatch:
  push:
    paths: ["pipeline/probe_urls.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -u -m pipeline.probe
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history/probe.txt
          git diff --cached --quiet || (git commit -m "Probe results" && git pull --rebase -X theirs origin main && git push)
