<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEORA · Physical Economy Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed globe; HUD panels float over it like an operations console. */
:root{
  --bg:#05070a; --panel:rgba(9,13,18,.82); --line:#1c2733; --ink:#dbe5ee; --dim:#748392; --hot:#5ad1ff;
  --deep:#3ddc97; --registry:#4ea8ff; --frag:#f5b83d; --closed:#ff5a5f;
  --construction:#4ea8ff; --property:#b583ff; --business:#3ddc97; --fitout:#5ad1ff; --restaurant:#f5b83d; --distress:#ff5a5f; --maintenance:#4b5866; --sale:#b583ff; --mortgage:#e879c6; --story:#ffffff;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#map{position:absolute;inset:0}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--mono)}

#top{top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:22px;padding:0 18px;border-width:0 0 1px}
#top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
#top h1 b{color:var(--hot);font-weight:700}
#top .stat{font-family:var(--mono);font-size:11px;color:var(--dim)}
#wch{margin-left:auto;background:#0d141c;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 10px;cursor:pointer}
#wch:hover,#wch.on{border-color:var(--hot);color:var(--hot)}
.abtn{flex:1;background:#0d141c;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:11px;padding:8px;cursor:pointer}
.abtn:hover{border-color:var(--hot)}
#top .stat i{font-style:normal;color:var(--ink)}
#clock{font-family:var(--mono);font-size:12px;color:var(--ink)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--closed);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

#left{top:60px;left:14px;width:250px;padding:14px;display:grid;gap:16px;max-height:calc(100% - 150px);overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:5px 6px;cursor:pointer;user-select:none;border:1px solid transparent}
.row:hover{border-color:var(--line)}
.row.off{opacity:.35}
.sw{width:10px;height:10px;flex:none;background:currentColor;box-shadow:0 0 10px currentColor}
.row .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.cities .row .sw{border-radius:50%}
#back{display:none;width:100%;background:#0d141c;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:12px;padding:8px;cursor:pointer}
#back:hover{border-color:var(--hot)}

#right{top:60px;right:14px;width:340px;padding:16px;display:none;max-height:calc(100% - 140px);overflow:auto}
#right.open{display:block}
#right h2{margin:2px 0 2px;font-size:24px;font-weight:700;letter-spacing:.04em}
#right .label:first-child,#right h2{padding-right:36px}
.close{position:absolute;top:8px;right:8px;width:30px;height:30px;background:#0d141c;border:1px solid var(--line);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.close:hover{border-color:var(--hot)}
.score{display:flex;align-items:baseline;gap:10px;margin:12px 0}
.score b{font-family:var(--mono);font-size:40px;font-weight:500}
.meter{height:4px;background:#121b24;margin-bottom:14px}
.meter i{display:block;height:100%}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv span:nth-child(odd){font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 14px;border-left:1px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 10px}
.tl li::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tl .d{font-family:var(--mono);font-size:11px;color:var(--dim)}
.tl .t{font-size:14px;margin:2px 0}
.tl .x,.tl .s{font-size:12px;color:var(--dim)}
.tl .s{font-family:var(--mono);font-size:10px}

.seg{display:flex;border:1px solid var(--line);margin-top:4px}
.seg button{flex:1;background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:11px;padding:6px 0;cursor:pointer}
.seg button.on{background:#16202b;color:var(--ink)}
.seg button:focus-visible{outline:1px solid var(--hot)}
#timebar{left:280px;right:70px;bottom:46px;padding:8px 12px;display:none;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
#timebar.show{display:grid}
#play{width:34px;height:34px;border:1px solid var(--line);background:#0d141c;color:var(--ink);font-size:13px;cursor:pointer}
#play:hover{border-color:var(--hot)}
#hist{width:100%;height:46px;display:block;cursor:pointer}
#range{font-family:var(--mono);font-size:12px;min-width:200px;text-align:right}
#ticker{left:0;right:0;bottom:0;height:34px;border-width:1px 0 0;display:flex;align-items:center;overflow:hidden}
#ticker .tag{flex:none;height:100%;display:flex;align-items:center;padding:0 14px;background:#0d141c;border-right:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.12em}
#feed{white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--dim);padding-left:100%;animation:scroll 90s linear infinite}
#feed span{margin-right:42px}
#feed b{font-weight:500}
@keyframes scroll{to{transform:translateX(-100%)}}

.maplibregl-ctrl-attrib{background:rgba(5,7,10,.6)!important;color:var(--dim)!important;margin-bottom:38px!important}
.maplibregl-ctrl-attrib a{color:var(--dim)!important}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--line)}
.maplibregl-ctrl-group button span{filter:invert(.85)}
.maplibregl-ctrl-bottom-right{bottom:40px}
@media (max-width:760px){#timebar{left:14px;right:14px;bottom:46px}#left{width:auto;right:14px;max-height:38%;overflow:auto}#right{left:14px;width:auto}#top .stat{display:none}}
@media (prefers-reduced-motion:reduce){#feed{animation:none;padding-left:14px}.live{animation:none}}
</style>
</head>
<body>
<div id="map"></div>

<header id="top" class="panel">
  <h1>GEO<b>RA</b></h1>
  <span class="stat" style="letter-spacing:.08em">physical economy intelligence</span>
  <span class="stat">coverage <i id="s-countries">20</i> countries</span>
  <span class="stat">live regions <i id="s-feeds">0</i></span>
  <span class="stat">events <i id="s-events">0</i></span>
  <button id="wch" title="Click a spot on the map to see what changed around it">◎ What changed here?</button>
  <span class="stat" id="s-load" style="color:var(--hot)"></span>
  <span id="clock"><span class="live"></span><span id="utc"></span></span>
</header>

<aside id="left" class="panel">
  <div>
    <div class="label" style="margin-bottom:6px">Data coverage</div>
    <div id="tiers"></div>
  </div>
  <div class="cities">
    <div class="label" style="margin-bottom:6px">Places</div>
    <div id="cities"></div>
  </div>
  <div id="evbox" hidden>
    <div class="label" style="margin-bottom:6px">Event layers</div>
    <div id="evlayers"></div>
    <div class="label" style="margin:12px 0 2px">Property value</div>
    <div class="seg" id="price"><button data-v="0" class="on">Any</button><button data-v="1000000">$1M+</button><button data-v="5000000">$5M+</button><button data-v="20000000">$20M+</button></div>
    <div class="label" style="margin:12px 0 2px">Time window</div>
    <div class="seg" id="win"><button data-d="7">7D</button><button data-d="30">30D</button><button data-d="90">90D</button><button data-d="0" class="on">All</button></div>
  </div>
  <div id="disbox" hidden>
    <div class="label" style="margin-bottom:6px">Disruptions · live</div>
    <div id="dislayers"></div>
  </div>
  <button id="back">◀ Back to globe</button>
</aside>

<section id="right" class="panel" aria-live="polite">
  <button class="close" id="close" aria-label="Close">×</button>
  <div id="r-body"></div>
</section>

<section id="timebar" class="panel">
  <button id="play" aria-label="Play">▶</button>
  <canvas id="hist" aria-label="Events per day. Click or drag to move through time."></canvas>
  <div id="range"></div>
</section>

<footer id="ticker" class="panel">
  <div class="tag"><span class="live"></span>FEED</div>
  <div id="feed"></div>
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
// Optional real data written by the data scripts (data/events.js sets window.EVENTS).
window.EVENTS = null;
</script>
<script src="data/events.js" onerror="void 0"></script>
<script>
/* ---------------- research atlas (Phase 0) ---------------- */
const TIERS = {
  deep:     { name: "Establishment-level", color: "var(--deep)" },
  registry: { name: "Company registry",    color: "var(--registry)" },
  frag:     { name: "City by city",        color: "var(--frag)" },
  closed:   { name: "Closed / unusable",   color: "var(--closed)" }
};
// key = ISO 3166 numeric code used by the world map
const COUNTRIES = {
  "250": { n: "France", s: 93, t: "deep", src: "SIRENE · BODACC · Alim'confiance · DVF", ev: "created, sold (with price), inspected, insolvent, closed", st: "Tested with real Paris data" },
  "410": { n: "South Korea", s: 84, t: "deep", src: "Local permit data (195 business types) · MOLIT", ev: "permit granted, suspended, closed, with coordinates", st: "Tested with real Seoul data" },
  "578": { n: "Norway", s: 80, t: "deep", src: "Enhetsregisteret sub-units", ev: "established, relocated, bankrupt, closed" },
  "208": { n: "Denmark", s: 78, t: "deep", src: "CVR production units (P-numbers)", ev: "established, relocated, closed" },
  "826": { n: "United Kingdom", s: 76, t: "frag", src: "Companies House · FSA food hygiene · Gazette · Land Registry", ev: "incorporated, inspected, insolvent, property sold" },
  "840": { n: "United States", s: 74, t: "frag", src: "City and state portals (NYC, SF, Chicago, Texas) · SEC · USAspending", ev: "permits, licences, inspections, property sales", st: "NYC is the first live city" },
  "076": { n: "Brazil", s: 72, t: "deep", src: "Receita Federal CNPJ establishments", ev: "established, branch opened, closed" },
  "056": { n: "Belgium", s: 70, t: "deep", src: "KBO/BCE establishment units", ev: "established, closed", st: "Provisional" },
  "392": { n: "Japan", s: 61, t: "registry", src: "Corporate Number daily changes · gBizINFO", ev: "created, relocated, merged, closed" },
  "702": { n: "Singapore", s: 60, t: "registry", src: "ACRA · SFA licences · URA", ev: "registered, closed" },
  "616": { n: "Poland", s: 60, t: "registry", src: "REGON local units · CEIDG · KRS", ev: "registered, suspended, closed", st: "Provisional" },
  "158": { n: "Taiwan", s: 58, t: "registry", src: "MOEA company registrations", ev: "registered, closed", st: "Provisional" },
  "484": { n: "Mexico", s: 58, t: "registry", src: "INEGI DENUE (twice a year)", ev: "establishment present / gone" },
  "233": { n: "Estonia", s: 58, t: "registry", src: "e-Business Register (daily)", ev: "registered, revenue, closed" },
  "036": { n: "Australia", s: 55, t: "frag", src: "ABN bulk · NSW Planning Portal · ASIC", ev: "registered, development applications, closed" },
  "124": { n: "Canada", s: 52, t: "frag", src: "Vancouver/Toronto licences · city permits", ev: "licences, permits, inspections" },
  "554": { n: "New Zealand", s: 45, t: "registry", src: "Companies Office events", ev: "registered, removed", st: "Provisional" },
  "784": { n: "United Arab Emirates", s: 35, t: "closed", src: "Dubai Pulse (unclear licence)", ev: "licences, property transactions" },
  "356": { n: "India", s: 25, t: "closed", src: "MCA snapshots (stale)", ev: "registered" },
  "276": { n: "Germany", s: 22, t: "closed", src: "No bulk access to the commercial register", ev: "—" }
};
// places that are researched but not ingested yet (live places come from data/regions.json)
const PLANNED = [
  { id: "seo", n: "Seoul", c: [126.978, 37.5665], status: "tested", note: "540,173 restaurant permits — tested Oct 2026" },
  { id: "lon", n: "London", c: [-0.1276, 51.5072], status: "planned", note: "Food hygiene ratings · Companies House" },
  { id: "osl", n: "Oslo", c: [10.7522, 59.9139], status: "planned", note: "Every business location, open API" }
];
let PLACES = [...PLANNED];
let REGIONS = [];
const CITY_COLOR = { live: "#5ad1ff", tested: "#3ddc97", planned: "#748392" };
const KINDS = { business: "New businesses", fitout: "Storefronts & interiors", construction: "New buildings & major work",
                sale: "Sales (property & businesses)", mortgage: "Mortgages & loans", restaurant: "Restaurant inspections",
                distress: "Closures & distress", maintenance: "Minor building work" };
const OFF_BY_DEFAULT = ["maintenance", "mortgage", "restaurant"];
// event types that count toward a "place with a story"
const STORY_KINDS = ["business", "fitout", "construction", "sale", "mortgage", "distress"];
const DIS = { quake: { n: "Earthquakes", c: "#ff8a3d" }, wildfires: { n: "Wildfires", c: "#ff4d4d" },
              severeStorms: { n: "Storms", c: "#9ad1ff" }, volcanoes: { n: "Volcanoes", c: "#ff3d9a" },
              floods: { n: "Floods", c: "#3d8bff" } };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = k => css("--" + k);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const placesFC = () => ({ type: "FeatureCollection", features: PLACES.map(c => ({ type: "Feature",
  geometry: { type: "Point", coordinates: c.c }, properties: { id: c.id, n: c.n, status: c.status } })) });

/* ---------------- map ---------------- */
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/dark",
  center: [-40, 30], zoom: 1.6, pitch: 0,
  attributionControl: { compact: true }, maxPitch: 75
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");

let spinning = !matchMedia("(prefers-reduced-motion: reduce)").matches;
function spin() {
  if (!spinning || map.getZoom() > 3.5) return;
  const c = map.getCenter(); c.lng -= 2.2;
  map.easeTo({ center: c, duration: 1000, easing: t => t });
}
map.on("moveend", () => { spin(); maybeLoad(); });
["mousedown", "touchstart", "wheel"].forEach(ev => map.on(ev, () => { spinning = false; }));

map.on("style.load", async () => {
  map.setProjection({ type: "globe" });
  try {
    map.setSky({ "sky-color": "#05070a", "horizon-color": "#0d2a3a", "fog-color": "#05070a",
      "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0] });
  } catch (e) {}
  dimBasemap();
  addBuildings();
  await addCountries();
  addPlaces();
  addEventLayers();
  addDisruptionLayers();
  spin();
});

function dimBasemap() {             // quieter basemap so our data glows
  for (const l of map.getStyle().layers) {
    if (l.type === "raster") map.setPaintProperty(l.id, "raster-opacity", 0.35);
    if (l.type === "symbol" && /poi|housenumber/.test(l.id)) map.setLayoutProperty(l.id, "visibility", "none");
  }
}

function addBuildings() {
  if (!map.getSource("openmaptiles") || map.getLayer("bld3d")) return;
  map.addLayer({ id: "bld3d", type: "fill-extrusion", source: "openmaptiles", "source-layer": "building", minzoom: 13,
    paint: { "fill-extrusion-color": "#16212c",
      "fill-extrusion-height": ["coalesce", ["get", "render_height"], 10],
      "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
      "fill-extrusion-opacity": ["interpolate", ["linear"], ["zoom"], 13, 0, 14, 0.85] } });
}

async function addCountries() {
  let geo;
  try {
    const topo = await (await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")).json();
    geo = topojson.feature(topo, topo.objects.countries);
  } catch (e) { console.warn("country shapes unavailable", e); return; }
  for (const f of geo.features) {
    const c = COUNTRIES[String(f.id).padStart(3, "0")];
    f.properties.code = String(f.id).padStart(3, "0");
    f.properties.tier = c ? c.t : "none";
  }
  map.addSource("countries", { type: "geojson", data: geo });
  const tierColor = ["match", ["get", "tier"], "deep", COL("deep"), "registry", COL("registry"),
                     "frag", COL("frag"), "closed", COL("closed"), "#000000"];
  map.addLayer({ id: "c-fill", type: "fill", source: "countries", maxzoom: 7,
    paint: { "fill-color": tierColor,
      "fill-opacity": ["case", ["==", ["get", "tier"], "none"], 0,
        ["interpolate", ["linear"], ["zoom"], 1, 0.22, 5, 0.08, 7, 0]] } });
  map.addLayer({ id: "c-glow", type: "line", source: "countries", maxzoom: 7,
    filter: ["!=", ["get", "tier"], "none"],
    paint: { "line-color": tierColor, "line-width": 6, "line-blur": 6, "line-opacity": 0.35 } });
  map.addLayer({ id: "c-line", type: "line", source: "countries", maxzoom: 7,
    paint: { "line-color": ["case", ["==", ["get", "tier"], "none"], "#22303d", tierColor],
      "line-width": ["case", ["==", ["get", "tier"], "none"], 0.4, 1] } });
  map.on("click", "c-fill", e => {
    if (map.queryRenderedFeatures(e.point, { layers: ["city-dot", "dis"].filter(l => map.getLayer(l)) }).length) return;
    const code = e.features[0].properties.code;
    if (COUNTRIES[code]) showCountry(code);
  });
  map.on("mouseenter", "c-fill", e => { if (e.features[0].properties.tier !== "none") map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "c-fill", () => map.getCanvas().style.cursor = "");
}

function addPlaces() {
  map.addSource("cities", { type: "geojson", data: placesFC() });
  const color = ["match", ["get", "status"], "live", CITY_COLOR.live, "tested", CITY_COLOR.tested, CITY_COLOR.planned];
  map.addLayer({ id: "city-pulse", type: "circle", source: "cities", maxzoom: 9,
    paint: { "circle-color": color, "circle-opacity": 0.25, "circle-blur": 0.6, "circle-radius": 14 } });
  map.addLayer({ id: "city-dot", type: "circle", source: "cities", maxzoom: 9,
    paint: { "circle-color": color, "circle-radius": 4.5, "circle-stroke-color": "#05070a", "circle-stroke-width": 1.5 } });
  map.addLayer({ id: "city-label", type: "symbol", source: "cities", maxzoom: 9,
    layout: { "text-field": ["upcase", ["get", "n"]], "text-font": ["Noto Sans Regular"], "text-size": 11,
              "text-offset": [0, 1.3], "text-anchor": "top", "text-letter-spacing": 0.15 },
    paint: { "text-color": "#dbe5ee", "text-halo-color": "#05070a", "text-halo-width": 1.5 } });
  map.on("click", "city-dot", e => flyToPlace(e.features[0].properties.id));
  map.on("mouseenter", "city-dot", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "city-dot", () => map.getCanvas().style.cursor = "");
  let r = 0;                                   // gentle pulse
  const pulse = () => {
    r = (r + 0.35) % 22;
    if (map.getLayer("city-pulse")) {
      map.setPaintProperty("city-pulse", "circle-radius", 6 + r);
      map.setPaintProperty("city-pulse", "circle-opacity", 0.35 * (1 - r / 22));
    }
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(pulse);
  };
  pulse();
}

/* ---------------- events: loaded region by region ---------------- */
const DAY = 86400000;
const evOn = new Set(Object.keys(KINDS).filter(k => !OFF_BY_DEFAULT.includes(k)));
const T = { win: 0, end: 0, min: Infinity, max: -Infinity, price: 0, story: true, playing: false };
const EV = { type: "FeatureCollection", features: [] };
let BY_LOC = new Map(), GEOM = new Map(), DAILY = [], ALL = [], STORIES = { type: "FeatureCollection", features: [] };
const fmt = t => new Date(t * DAY).toISOString().slice(0, 10);

function ingest(region, feats) {
  const wasAtEnd = T.end >= T.max;
  for (const f of feats) {
    const p = f.properties;
    if (p.kind === "property") p.kind = p.sub === "Deed" ? "sale" : "mortgage";
    p.t = Math.floor(Date.parse(p.date + "T00:00:00Z") / DAY);
    if (!isFinite(p.t)) continue;
    p.amt = Number(p.amount) || 0;
    p.region = region;
    const key = p.loc || p.bbl;
    if (key) {
      p.key = region + "|" + key;
      if (!BY_LOC.has(p.key)) { BY_LOC.set(p.key, []); GEOM.set(p.key, f.geometry); }
      BY_LOC.get(p.key).push(p);
    }
    p._c = f.geometry.coordinates;
    ALL.push(p); EV.features.push(f);
    if (p.t < T.min) T.min = p.t;
    if (p.t > T.max) T.max = p.t;
  }
  if (wasAtEnd || !T.end) T.end = T.max;
  // places with a story: two or more different kinds of significant events at the same location
  STORIES.features = [];
  for (const [key, list] of BY_LOC) {

  const tot = d => [...evOn].reduce((a, k) => a + (d[k] || 0), 0);
  const sorted = DAILY.map(tot).sort((a, b) => a - b);
  const peak = Math.max(1, sorted[Math.floor(sorted.length * 0.95)] * 1.15), n = DAILY.length, w = r.width / n;
  const H = r.height - 14;
  const start = T.win ? T.end - T.win + 1 : T.min;
  DAILY.forEach((d, i) => {

    for (const k of Object.keys(KINDS)) {
      if (!evOn.has(k) || !d[k] || y <= 2) continue;
      const h = Math.min(y - 2, (d[k] / peak) * H);
      g.fillStyle = COL(k); g.globalAlpha = inWin ? 0.95 : 0.2;
      g.fillRect(i * w, y - h, Math.max(1, w - 0.5), h); y -= h;
    }
    if (tot(d) > peak) { g.globalAlpha = 1; g.fillStyle = "#ffffff"; g.fillRect(i * w, 0, Math.max(1, w - 0.5), 2); }
  });
  g.globalAlpha = 1; g.fillStyle = "#748392"; g.font = "10px 'IBM Plex Mono', monospace";
  g.fillText(fmt(T.min), 0, r.height - 1);

  const x = ((T.end - T.min + 1) / n) * r.width;

}

      const parts = await Promise.all(m.files.map(f => fetch(`data/${r.id}/${f.file}`).then(x => x.json())));
      ingest(r.id, parts.flatMap(p => p.features));

}

    <div class="mono" style="font-size:11px;color:var(--dim)">${fmt(start)} → ${fmt(end)} (${W} days) vs the ${W} days before · ${near.length ? esc(near.map(r => r.name).join(", ")) : "no GEORA data here yet"}</div>
    <input type="range" id="area-r" min="0.2" max="5" step="0.1" value="${km0}" aria-label="Radius" style="width:100%;margin:12px 0 4px;accent-color:#5ad1ff">
    <div class="kv" style="margin-top:8px">
      <span>Activity</span><span><b>${cur.length.toLocaleString()}</b> public record${cur.length === 1 ? "" : "s"} at ${places.toLocaleString()} place${places === 1 ? "" : "s"}${prev.length ? ` · ${(() => { const d = Math.round((cur.length - prev.length) / prev.length * 100); return `<span style="color:${d >= 0 ? "var(--business)" : "var(--distress)"}">${d >= 0 ? "+" : ""}${d}%</span>`; })()} vs before` : ""}</span>
      ${Object.keys(KINDS).filter(k => cc[k] || pc[k]).map(k => `<span style="color:${COL(k)}">${esc(KINDS[k])}</span><span>${(cc[k] || 0).toLocaleString()} · ${delta(k)}</span>`).join("")}
      ${sales.length ? `<span>Sales value</span><span>${fmtMoney(sales.reduce((a, b) => a + b, 0))} total · median ${fmtMoney(median)}</span>` : ""}
      ${stories ? `<span>Places with a story</span><span>${stories}</span>` : ""}
      ${dis.length ? `<span>Disruptions nearby</span><span>${dis.length} within 50 km</span>` : ""}
    </div>
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="margin-top:12px;display:block" aria-label="Records per day inside the circle">${spark}</svg>
    ${notable.length ? `<div class="label" style="margin-top:14px">Notable</div><ul class="tl">${notable.map(x => `<li style="--c:${COL(x.kind)}"><div class="d">${esc(x.date)}</div><div class="t">${esc(x.title)}</div><div class="s">${esc(x.addr || "")} · ${esc(x.source)}</div></li>`).join("")}</ul>` : ""}
    <div style="display:flex;gap:8px;margin-top:10px"><button class="abtn" id="area-play">▶ Replay this area</button><button class="abtn" id="area-clear">Clear</button></div>
    <p class="mono" style="font-size:10px;color:var(--dim);margin-top:10px">Counts are records in GEORA's public sources. Some sources publish with a delay (NYC property: 2–3 months), so the latest weeks can look quieter than they were.</p>`);
  document.getElementById("area-r").oninput = e => { AREA.km = +e.target.value; drawArea(); analyzeArea(); };
  document.getElementById("area-clear").onclick = () => { AREA.c = null; drawArea(); document.getElementById("right").classList.remove("open"); };
  document.getElementById("area-play").onclick = () => {
    map.flyTo({ center: c, zoom: Math.max(map.getZoom(), 14 - Math.log2(Math.max(0.3, km0))), duration: 1500 });
    if (!T.playing) { T.end = T.min + 6; document.getElementById("play").click(); }
  };
}

/* ---------------- panels ---------------- */
function row(name, color, n) {
  const el = document.createElement("div");
  el.className = "row"; el.tabIndex = 0;
  el.innerHTML = `<span class="sw" style="color:${color}"></span><span>${esc(name)}</span><span class="n">${esc(n)}</span>`;
  el.onkeydown = e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), el.click());
  return el;
}
function openPanel(html) { document.getElementById("r-body").innerHTML = html; document.getElementById("right").classList.add("open"); }
document.getElementById("close").onclick = () => document.getElementById("right").classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("right").classList.remove("open"); });

function showCountry(code) {
  const c = COUNTRIES[code], tier = TIERS[c.t];
  const live = REGIONS.filter(r => r.country === { "250": "FR", "840": "US", "410": "KR", "826": "GB", "578": "NO", "124": "CA", "208": "DK", "246": "FI", "233": "EE" }[code]);
  openPanel(`<div class="label">Country coverage</div><h2>${esc(c.n)}</h2>
    <div class="score"><b>${c.s}</b><span class="label">observability / 100</span></div>
    <div class="meter"><i style="width:${c.s}%;background:${tier.color}"></i></div>
    <div class="kv"><span>Tier</span><span style="color:${tier.color}">${esc(tier.name)}</span>
    <span>Sources</span><span>${esc(c.src)}</span><span>Events</span><span>${esc(c.ev)}</span>
    <span>Status</span><span>${live.length ? "Live: " + esc(live.map(r => `${r.name} (${(r.events || 0).toLocaleString()} events)`).join(", ")) : esc(c.st || "Researched, not ingested yet")}</span></div>`);
}

function showLocation(p) {
  let list = p.key ? (BY_LOC.get(p.key) || [p]) : [p];
  if (!p.addr && list[0]) p = Object.assign({}, p, { addr: list[0].addr });
  list = [...list].sort((a, b) => b.date.localeCompare(a.date));
  const sources = new Set(list.map(x => x.source));
  openPanel(`<div class="label">Location timeline</div><h2>${esc(p.addr || "Location")}</h2>
    <div class="mono" style="font-size:11px;color:var(--dim)">${list.length} public record${list.length > 1 ? "s" : ""} · ${sources.size} source${sources.size > 1 ? "s" : ""}</div>
    <ul class="tl">${list.map(x => `<li style="--c:${COL(x.kind)}"><div class="d">${esc(x.date)}${x.seen && x.seen !== x.date ? ` · first seen ${esc(x.seen)}` : ""}</div>
      <div class="t">${esc(x.title)}</div><div class="x">${esc(x.detail)}</div>
      <div class="s">${esc(x.source)} · record ${esc(x.rid || "—")}</div></li>`).join("")}</ul>`);
}

function flyToPlace(id) {
  const c = PLACES.find(x => x.id === id);
  if (!c) return;
  spinning = false;
  const r = REGIONS.find(x => x.id === c.region);
  if (r) loadRegion(r);
  map.flyTo({ center: c.c, zoom: r ? 13.2 : 11, pitch: 60, bearing: -25, duration: 4500, essential: true });
  document.getElementById("back").style.display = "block";
  openPanel(`<div class="label">Place</div><h2>${esc(c.n)}</h2>
    <div class="kv" style="margin-top:12px"><span>Status</span><span style="color:${CITY_COLOR[c.status]}">${esc(c.status === "live" ? "Live data, refreshed daily" : c.status === "tested" ? "Data tested, not on the map yet" : "Planned")}</span>
    ${c.events ? `<span>Events</span><span>${c.events.toLocaleString()} (latest ${esc(c.last)})</span>` : ""}
    <span>Data</span><span>${esc(c.note)}</span></div>`);
}
document.getElementById("back").onclick = () => {
  map.flyTo({ center: [map.getCenter().lng, 25], zoom: 1.6, pitch: 0, bearing: 0, duration: 3500 });
  document.getElementById("back").style.display = "none";
  document.getElementById("right").classList.remove("open");
  setTimeout(() => { spinning = true; spin(); }, 3600);
};

/* ---------------- HUD ---------------- */
(function buildTiers() {
  const t = document.getElementById("tiers");
  for (const [k, v] of Object.entries(TIERS)) {
    const n = Object.values(COUNTRIES).filter(c => c.t === k).length;
    t.appendChild(row(v.name, v.color, n));
  }
  document.getElementById("s-countries").textContent = Object.keys(COUNTRIES).length;
})();
function buildPlaces() {
  const cbox = document.getElementById("cities"); cbox.innerHTML = "";
  for (const c of PLACES) {
    const el = row(c.n, CITY_COLOR[c.status], c.status === "live" && c.events ? c.events.toLocaleString() : c.status);
    el.onclick = () => flyToPlace(c.id);
    cbox.appendChild(el);
  }
}
buildPlaces();
function setFeed(html) { document.getElementById("feed").innerHTML = html; }
function updateFeed() {
  const items = [];
  const recent = [...ALL].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30);
  for (const p of recent) items.push(`<span><b style="color:${COL(p.kind)}">●</b> ${esc(p.date)} · ${esc(REGIONS.find(r => r.id === p.region)?.name || "")} · ${esc(p.title)}${p.addr ? " · " + esc(p.addr) : ""}</span>`);
  const dis = [...DISFC.features].sort((a, b) => b.properties.time - a.properties.time).slice(0, 8);
  for (const f of dis) items.push(`<span><b style="color:${DIS[f.properties.cat].c}">◯</b> ${esc(DIS[f.properties.cat].n.toUpperCase())} · ${esc(f.properties.title)}</span>`);
  if (!ALL.length) for (const r of REGIONS) items.push(`<span><b style="color:${CITY_COLOR.live}">●</b> ${esc(r.name.toUpperCase())} · ${(r.events || 0).toLocaleString()} events · latest ${esc(r.last)}</span>`);
  items.push(`<span>● Click a country for its data coverage · click a place to fly in · click a ring for a disruption's economic exposure</span>`);
  setFeed(items.join(""));
}
updateFeed();

/* ---------------- start: local events.js (old desktop copy) or the website's regions ---------------- */
(async function start() {
  await loadRegions();
  if (window.EVENTS && !REGIONS.length) {          // old local copy without regions.json
    REGIONS = [{ id: "us-nyc", name: "New York", country: "US", center: [-73.985, 40.742], bbox: [-74.3, 40.45, -73.65, 40.95], loaded: true, events: window.EVENTS.features.length }];
    ingest("us-nyc", window.EVENTS.features);
  }
  loadDisruptions();
})();

setInterval(() => { document.getElementById("utc").textContent = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC"; }, 1000);
</script>
